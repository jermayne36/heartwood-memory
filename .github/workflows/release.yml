name: Heartwood CI and signed release

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: signed-python-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pull-request-ci:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Prove the release signing key is unavailable to pull-request code
        shell: bash
        run: |
          assert_release_signing_key_absent() {
            # @fail-closed(release-signing-key-pr-boundary)
            if [[ "${HEARTWOOD_RELEASE_SIGNING_KEY_B64+x}" == "x" ]]; then
              echo "HEARTWOOD_RELEASE_SIGNING_KEY_B64 is unexpectedly present in pull-request CI" >&2
              return 1
            fi
          }

          # @positive-control(release-signing-key-pr-boundary)
          if HEARTWOOD_RELEASE_SIGNING_KEY_B64=positive-control assert_release_signing_key_absent 2>/dev/null; then
            echo "release signing-key boundary positive control did not fire" >&2
            exit 1
          fi
          echo "release_signing_key_positive_control=blocked"

          assert_release_signing_key_absent
          echo "release_signing_key_present=false"
      - name: Install CI dependencies
        run: python -m pip install -e ".[dev]" twine
      - name: Lint and test before build
        run: bash scripts/check.sh
      - name: Build unsigned wheel and sdist
        run: python -m build --wheel --sdist --outdir dist
      - name: Verify unsigned package metadata
        run: python -m twine check dist/heartwood_memory-*.whl dist/heartwood_memory-*.tar.gz

  build-sign-verify:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      HEARTWOOD_RELEASE_SIGNING_KEY_B64: ${{ secrets.HEARTWOOD_RELEASE_SIGNING_KEY_B64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install release dependencies
        run: python -m pip install -e ".[dev]" twine
      - name: Lint and test before build
        run: bash scripts/check.sh
      - name: Match a release tag to the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PACKAGE_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$GITHUB_REF_NAME" = "v${PACKAGE_VERSION}"
      - name: Build and sign wheel, sdist, and manifest
        run: python scripts/build_release.py
      - name: Verify published-key boundary and package metadata
        run: |
          test -n "$HEARTWOOD_RELEASE_SIGNING_KEY_B64"
          cmp dist/heartwood-release-public-key.txt docs/release/heartwood-release-public-key-v1.txt
          python -m heartwood.release_verify \
            --manifest dist/heartwood-memory-release-manifest.json \
            --public-key dist/heartwood-release-public-key.txt \
            --public-key-fingerprint "$(cat docs/release/heartwood-release-public-key-v1.sha256)" \
            --artifact dist/heartwood_memory-*.whl \
            --artifact dist/heartwood_memory-*.tar.gz
          python -m twine check dist/heartwood_memory-*.whl dist/heartwood_memory-*.tar.gz
      - name: Upload signed release bundle
        uses: actions/upload-artifact@v4
        with:
          name: signed-python-release
          path: |
            dist/heartwood_memory-*.whl
            dist/heartwood_memory-*.tar.gz
            dist/heartwood-memory-release-manifest.json
            dist/heartwood-release-public-key.txt
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-sign-verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: signed-python-release
          path: dist
      - name: Stage immutable verification assets in a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          RELEASE_STATE="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null || echo missing)"
          test "$RELEASE_STATE" != "false"
          if test "$RELEASE_STATE" = "missing"; then
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" \
            dist/heartwood-memory-release-manifest.json \
            dist/heartwood-release-public-key.txt \
            --clobber
      - name: Publish wheel and sdist to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          test -n "$TWINE_PASSWORD"
          python -m pip install twine
          python -m twine upload dist/heartwood_memory-*.whl dist/heartwood_memory-*.tar.gz
      - name: Publish the release after PyPI succeeds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
